services:
  - type: web
    name: chicken-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_ui.py $PORT --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHICKEN_MODEL
        value: deepseek-chat
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
